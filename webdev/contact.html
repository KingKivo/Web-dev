    <body>

        <div class="contact-container">
            <header>
                <h1>Contact Form</h1>
                <p>Fill in the form below and I'll get back to you as soon as possible.</p>
            </header>

            <form name="contact-form" onsubmit="return validateForm()" method="post" required>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" name="name" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" name="subject" placeholder="What is this regarding?">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea name="message" rows="6" placeholder="Write your message here..."></textarea>
                </div>

                <button class="submit" value="Submit">Send Message</button>
            </form>
        </div>

    </body>
